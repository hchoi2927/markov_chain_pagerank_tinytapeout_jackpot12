# Tiny Tapeout project information
project:
  title:        "Markov Chain - PageRank"      # Project title
  author:       "Nitika Chakkirala, Helen Choi"      # Your name
  discord:      "nikki2358, heleny_0927"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Markov Chain PageRank Engine: iterative 6×6 matrix-vector multiplication with 6 parallel MAC units."      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     100000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nitikac24_hchoi2927_pagerank"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "markov_top.sv"
    - "mac_unit.sv"
    - "transition_mem.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "start"
  ui[1]: "rd_en"
  ui[2]: "rd_addr[0]"
  ui[3]: "rd_addr[1]"
  ui[4]: "rd_addr[2]"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "done"
  uo[1]: "rd_data[8]"
  uo[2]: "rd_data[9]"
  uo[3]: "rd_data[10]"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "rd_data[0]"
  uio[1]: "rd_data[1]"
  uio[2]: "rd_data[2]"
  uio[3]: "rd_data[3]"
  uio[4]: "rd_data[4]"
  uio[5]: "rd_data[5]"
  uio[6]: "rd_data[6]"
  uio[7]: "rd_data[7]"

# Do not change!
yaml_version: 6
